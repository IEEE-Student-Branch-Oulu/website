repos:
  # ── Universal ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: tsconfig\.json$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Secrets scanning ─────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Frontend (Node/ESLint/Prettier) ──────────────────────────
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (frontend)
        language: system
        entry: bash -c 'a=(); for f in "$@"; do a+=("${f#frontend/}"); done; cd frontend && npx prettier --write "${a[@]}"' _
        types_or: [ts, vue, javascript, css, json]
        files: ^frontend/
        pass_filenames: true

      - id: eslint
        name: ESLint (frontend)
        language: system
        entry: bash -c 'a=(); for f in "$@"; do a+=("${f#frontend/}"); done; cd frontend && npx eslint --fix "${a[@]}"' _
        types_or: [ts, vue, javascript]
        files: ^frontend/
        pass_filenames: true

  # ── Backend (Python) ─────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff # lints + auto-fixes
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format # formats (replaces black)
        files: ^backend/

  # mypy runs against the project venv via uv so it sees the real dep set
  # (mirrors how ESLint/Prettier above use the frontend's node_modules).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        language: system
        entry: bash -c 'cd backend && uv run mypy app scripts'
        files: ^backend/(app|scripts)/.*\.py$
        pass_filenames: false
