repos:
  # ── Universal ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Secrets scanning ─────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Frontend (Node/ESLint/Prettier) ──────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        language: node
        entry: bash -c 'cd frontend && npx eslint --fix'
        types_or: [ts, vue, javascript]
        files: ^frontend/
        pass_filenames: true

      - id: prettier
        name: Prettier (frontend)
        language: node
        entry: bash -c 'cd frontend && npx prettier --write .'
        types_or: [ts, vue, javascript, css, json]
        files: ^frontend/
        pass_filenames: true

  # ── Backend (Python) ─────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff # lints + auto-fixes
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format # formats (replaces black)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/
        args: ["--config-file=backend/mypy.ini"]
        additional_dependencies:
          - "fastapi"
          - "sqlalchemy"
          - "pydantic"
