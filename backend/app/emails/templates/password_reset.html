{% extends "_base.html" %}
{% block content %}
<h2>Reset your password</h2>
<p>Hi {{ first_name }},</p>
<p>Click the link below to reset your password:</p>
<p><a href="{{ reset_url }}" style="display: inline-block; padding: 12px 24px; background: #006699; color: #fff; text-decoration: none; border-radius: 4px;">Reset Password</a></p>
<p>This link expires in 1 hour. If you didn't request a password reset, you can safely ignore this email.</p>
{% endblock %}
